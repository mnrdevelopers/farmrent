<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmRent - Authentication Redirect</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Inline CSS for redirection message -->
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .redirect-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .redirect-box h3 {
            color: #2B5C2B;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Redirect Message -->
    <div class="redirect-box">
        <h3>FarmRent Authentication Portal</h3>
        <p>Please select your role to proceed to the dedicated login/registration portal:</p>
        
        <div class="d-grid gap-2 mt-4">
            <a href="customer-auth.html" class="btn btn-lg btn-success">
                <i class="fas fa-user me-2"></i> Customer Portal
            </a>
            <a href="seller-auth.html" class="btn btn-lg btn-secondary">
                <i class="fas fa-store me-2"></i> Seller Portal
            </a>
            <a href="admin-auth.html" class="btn btn-lg btn-danger">
                <i class="fas fa-user-shield me-2"></i> Admin Portal
            </a>
        </div>

        <p class="mt-4 text-muted">You are being redirected to a dedicated authentication page based on your role.</p>
    </div>
</body>
</html>
