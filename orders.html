<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmRent - My Orders</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-remote-config-compat.js"></script>
    <style>
        .order-card .card-header {
            background-color: var(--farm-green);
            color: white;
        }
        .order-status-pending {
            background-color: #FFF3CD;
            color: #856404;
        }
        .order-status-active {
            background-color: #D1ECF1;
            color: #0C5460;
        }
        .order-status-completed {
            background-color: #D4EDDA;
            color: #155724;
        }
        .order-status-cancelled {
            background-color: #F8D7DA;
            color: #721C24;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* --- Dynamic Order Tracker Styles (New) --- */
        .order-tracker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            position: relative;
            margin: 20px 0;
        }

        .tracker-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 10;
        }

        .step-icon-container {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e9ecef;
            color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 5px;
            transition: all 0.4s ease;
            box-shadow: 0 0 0 0 rgba(43, 92, 43, 0.4);
        }

        .step-text {
            font-size: 0.75rem;
            font-weight: 500;
            color: #6c757d;
            transition: color 0.4s;
        }

        /* Tracker Line */
        .tracker-line {
            position: absolute;
            top: 35px; /* Adjust based on icon container height */
            left: 0;
            right: 0;
            height: 4px;
            background-color: #e9ecef;
            z-index: 5;
            margin: 0 45px; /* Adjust based on icon container width/spacing */
        }
        
        .tracker-progress {
            height: 100%;
            width: 0; /* Updated by JS */
            background-color: var(--farm-green);
            transition: width 0.6s ease-in-out;
            border-radius: 2px;
        }

        /* Active/Completed State */
        .tracker-step.active .step-icon-container,
        .tracker-step.completed .step-icon-container {
            background-color: var(--farm-green);
            color: white;
            box-shadow: 0 0 0 6px rgba(43, 92, 43, 0.2);
            animation: pulse-step 1.5s infinite;
        }
        
        .tracker-step.completed .step-icon-container {
             background-color: #155724; /* Deeper green for completed */
             box-shadow: 0 0 0 0 rgba(43, 92, 43, 0.2); /* Remove pulse on completed */
             animation: none;
        }

        .tracker-step.active .step-text,
        .tracker-step.completed .step-text {
            color: var(--farm-green);
        }
        
        @keyframes pulse-step {
            0% { box-shadow: 0 0 0 0 rgba(43, 92, 43, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(43, 92, 43, 0); }
            100% { box-shadow: 0 0 0 0 rgba(43, 92, 43, 0); }
        }
        
        /* Responsive adjustments for text */
        @media (max-width: 576px) {
            .tracker-step {
                font-size: 0.65rem;
            }
            .step-icon-container {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            .tracker-line {
                top: 29px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation (Placeholder for script.js to populate) -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-tractor me-2"></i>FarmRent
            </a>
            
            <!-- NEW: Toggler and Icons Container (FIX: Hamburger menu confirmed/ensured here) -->
            <div class="d-flex align-items-center order-lg-3 gap-2">
                <!-- Auth and Icons links loaded by script.js and always visible (Mobile and Desktop) -->
                <ul class="navbar-nav flex-row align-items-center" id="navbar-auth">
                <!-- Icons/Auth links loaded by script.js -->
                </ul>
                
                <!-- Hamburger Menu -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="browse.html">Browse Equipment</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Orders Section -->
    <section class="py-5">
        <div class="container">
            <h1 class="section-title">My Rental Orders</h1>
            
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Loading rental history...</p>
            </div>

            <div class="row" id="orders-list">
                <!-- Order cards will be dynamically populated by script.js -->
            </div>
        </div>
    </section>

    <!-- Order Details Modal (Used by viewOrderDetailsModal) -->
    <div class="modal fade" id="orderDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Order Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Detailed information will go here -->
                    <!-- The dynamic tracker HTML will be inserted here by JS -->
                    <div id="order-tracker-container"></div> 
                    <div id="order-details-content" class="mt-4">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                            <p class="mt-3">Loading order details...</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <!-- Dynamic action buttons (e.g., Cancel) added here by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="text-center">&copy; 2025 FarmRent. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // Use existing script.js functions
        document.addEventListener('DOMContentLoaded', () => {
            // Note: The visibility of #loading is controlled within script.js/loadOrdersPage
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
