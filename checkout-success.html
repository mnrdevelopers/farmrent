<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - FarmRent</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .success-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-card {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container success-container">
        <div class="card success-card shadow-lg text-center p-5">
            <div class="mb-4">
                <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
            </div>
            <h2 class="mb-3 text-success">Payment Successful!</h2>
            <p class="text-muted mb-4">Your rental booking has been confirmed.</p>
            
            <div class="alert alert-success mb-4" id="order-details">
                <p class="mb-1"><strong>Order ID:</strong> <span id="order-id">Loading...</span></p>
                <p class="mb-1"><strong>Payment Method:</strong> <span id="payment-method">Loading...</span></p>
                <p class="mb-0"><strong>Amount Paid:</strong> <span id="amount-paid">Loading...</span></p>
            </div>
            
            <p class="text-muted mb-4">
                A confirmation email has been sent to your registered email address.
                Please check your inbox (and spam folder) for booking details.
            </p>
            
            <div class="d-grid gap-2">
                <a href="orders.html" class="btn btn-primary">
                    <i class="fas fa-clipboard-list me-2"></i>View My Orders
                </a>
                <a href="index.html" class="btn btn-outline-secondary">
                    <i class="fas fa-home me-2"></i>Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            
            if (orderId) {
                document.getElementById('order-id').textContent = orderId.substring(0, 8);
                
                try {
                    // Get order details from Firestore
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    const orderDoc = await window.FirebaseDB.collection('artifacts').doc(appId)
                        .collection('public').doc('data').collection('orders').doc(orderId).get();
                    
                    if (orderDoc.exists) {
                        const orderData = orderDoc.data();
                        document.getElementById('payment-method').textContent = orderData.paymentMethod || 'Cashfree';
                        document.getElementById('amount-paid').textContent = window.firebaseHelpers.formatCurrency(orderData.totalAmount || 0);
                    }
                } catch (error) {
                    console.error('Error loading order details:', error);
                }
            }
            
            // Auto-redirect after 10 seconds
            setTimeout(() => {
                window.location.href = 'orders.html';
            }, 10000);
        });
    </script>
</body>
</html>
